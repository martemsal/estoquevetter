<!doctype html>
<html lang="pt-BR" style="background-color: #0b1120;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estoque Vetter" />
    <meta name="theme-color" content="#0284c7" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="manifest" href="/manifest.json" />
    <title>Estoque Vetter | Tablet 3 Centrais</title>
    <script>
      try {
        ['HTML5_QRCODE_DATA', 'vetter_token', 'user'].forEach(function(k) {
          var v = localStorage.getItem(k);
          if (v && (v === '[object Object]' || v === 'undefined' || v === 'null')) {
            localStorage.removeItem(k);
          } else if (k === 'HTML5_QRCODE_DATA' && v) {
            try { JSON.parse(v); } catch(e) { localStorage.removeItem(k); }
          }
        });
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white select-none" style="background-color: #0b1120; margin: 0; color: #f1f5f9;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
